# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - launcher: null
  - platform: gpu
  - paths: default
  - hydra: default
  - _self_
task_name: generate_remd
pdb_dir: ${paths.data_dir}/pdbs
seq_name: null
seq_filename: null
seq_idx: null
min_temp: 300
max_temp: 450
n_states: null
timestep_fs: 2.0
constraints: HBonds # One of: HBonds, AllBonds, HAngles, or null for no constraints
com_restraint: false # Apply force to keep COM of peptide complexes together
forcefield_files:
  - amber14-all.xml
  - implicit/obc1.xml
warmup_time_ns: 0.5 # Warmup duration in nanoseconds
frame_interval: 2_500 # How many integration steps between iterations (i.e. swap attempts and frame recordings)
time_ns: 25.0 # Total simulation time in nanoseconds
demultiplex: false # Extract per-state trajectories and swap rates after simulation

# Thermal scrambling (simulated-annealing cycle) applied before REMD starts.
# When enabled, the starting structure is heated, held hot to cross barriers, cooled
# back to min_temp, and re-equilibrated. The post-equilibration snapshot is used for
# all replicas. Use different scramble_seed values across runs to produce K
# independent starting structures; verify decorrelation by pairwise RMSD of the saved
# scramble_snapshot.pdb files (if they're all within ~1 A, push high_temp higher or
# hold longer).
scramble: false
scramble_seed: 0
scramble_high_temp: 450 # Kelvin; stay <= ~450 K to preserve native fold
scramble_ramp_up_ps: 100 # heat min_temp -> scramble_high_temp
scramble_hold_ps: 300 # hold hot to cross barriers (200-500 ps)
scramble_ramp_down_ps: 150 # cool back to min_temp (gradual ramp, NOT an instant quench)
scramble_equilibrate_ps: 150 # re-equilibrate at min_temp before emitting snapshot
scramble_ramp_update_ps: 1.0 # ps between integrator.setTemperature calls during ramps
