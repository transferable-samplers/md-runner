# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - launcher: null
  - platform: gpu
  - paths: default
  - hydra: default
  - _self_
task_name: generate_remd
pdb_dir: ${paths.data_dir}/pdbs
output_dir: ${paths.data_dir}/remd/${seq_name}_${min_temp}K-${max_temp}K_${n_states}_${timestep_fs}_${frame_interval}
seq_name: null
seq_filename: null
seq_idx: null
min_temp: 300
max_temp: 500
n_states: 6
timestep_fs: 2.0
com_restraint: false  # Apply force to keep COM of peptide complexes together
forcefield_files:
  - amber14-all.xml
  - implicit/obc1.xml
warmup_iterations: 10 # How many iterations to run before starting to record frames
frame_interval: 2_500 # How many integration steps between iterations (i.e. swap attempts and frame recordings)
time_ns: 1.0 # Total simulation time in nanoseconds
demultiplex: true # Extract per-state trajectories and swap rates after simulation
